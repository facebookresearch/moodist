name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint dependencies
        run: python -m pip install pre-commit==4.3.0

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Syntax check
        run: python -m compileall --quiet py/ tests/ benchmarks/ setup.py

  gpu-smoke:
    name: GPU Smoke (PyTorch ${{ matrix.torch-version }})
    if: github.repository == 'facebookresearch/moodist'
    runs-on: ubuntu-latest-gpu
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        torch-version:
          - "2.7.1"
          - "2.11.0"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu128

      - name: Verify GPU runner
        run: |
          nvidia-smi
          python -c 'import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

      - name: Build Moodist
        run: python -m pip install --no-build-isolation -e .

      - name: Run single-GPU smoke suite over TCP
        env:
          MOODIST_USE_TCP: "1"
        run: torchrun --standalone --nproc-per-node=1 tests/run.py --timeout 600 --per-rank-logs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-pytorch-${{ matrix.torch-version }}
          path: test_logs/
          if-no-files-found: ignore
