name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.4

      - name: Run Ruff
        run: ruff check py/ tests/ benchmarks/ setup.py

      - name: Syntax check
        run: python -m compileall -q py/ tests/ benchmarks/ setup.py

  gpu-smoke:
    name: GPU Smoke (PyTorch ${{ matrix.torch-version }})
    if: github.repository == 'facebookresearch/moodist'
    runs-on: ubuntu-latest-gpu

    strategy:
      matrix:
        torch-version:
          - "2.7.1"
          - "2.11.0"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu128

      - name: Verify GPU runner
        run: |
          nvidia-smi
          python -c 'import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

      - name: Build Moodist
        run: python -m pip install --no-build-isolation -e .

      - name: Run single-GPU smoke suite over TCP
        env:
          MOODIST_USE_TCP: "1"
        run: torchrun --standalone --nproc-per-node=1 tests/run.py
