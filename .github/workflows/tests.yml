name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.3.0

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Syntax check
        run: python -m compileall -q py/ tests/ benchmarks/ setup.py

  gpu-tcp-smoke:
    name: Single-GPU TCP Smoke (PyTorch ${{ matrix.torch-version }}.x)
    if: github.repository == 'facebookresearch/moodist'
    runs-on: 4-core-ubuntu-gpu-t4

    strategy:
      fail-fast: false
      matrix:
        torch-version:
          - "2.7"
          - "2.8"
          - "2.9"
          - "2.10"
          - "2.11"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install CUDA toolkit
        run: |
          conda create --yes --quiet --prefix "$RUNNER_TEMP/cuda-toolkit" \
            --override-channels \
            --channel nvidia/label/cuda-12.8.1 \
            --channel conda-forge \
            cuda-nvcc=12.8 cuda-cudart-dev=12.8
          echo "$RUNNER_TEMP/cuda-toolkit/bin" >> "$GITHUB_PATH"
          echo "CUDAToolkit_ROOT=$RUNNER_TEMP/cuda-toolkit" >> "$GITHUB_ENV"

      - name: Install PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake
          python -m pip install "torch==${{ matrix.torch-version }}.*" --index-url https://download.pytorch.org/whl/cu128

      - name: Verify GPU runner
        run: |
          nvidia-smi
          python -c 'import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))'

      - name: Build and install Moodist wheel
        run: |
          python setup.py bdist_wheel -k --py-limited-api cp310 --dist-dir "$RUNNER_TEMP/wheels"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/*.whl

      - name: Run single-GPU smoke suite over TCP
        env:
          MOODIST_USE_TCP: "1"
        run: |
          torchrun --standalone --nproc-per-node=1 tests/run.py \
            test_allocator.py \
            test_cuda_copy.py \
            test_serialize.py
          torchrun --standalone --nproc-per-node=1 tests/run.py \
            test_store.py::test_store_basic_set_get
