name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check py/ tests/ benchmarks/ setup.py

      - name: Syntax check
        run: |
          find py/ tests/ benchmarks/ -name "*.py" | xargs python3 -m py_compile
          python3 -m py_compile setup.py

  gpu-tests:
    name: GPU & IB Tests
    if: github.repository == 'facebookresearch/moodist'
    runs-on: ubuntu-22.04-4-core-nvidia-gpu  # TODO: confirm largest available GPU runner for facebookresearch org

    strategy:
      matrix:
        include:
          - torch-version: "2.5.1"
            python-version: "3.9"
          - torch-version: "2.6.0"
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Detect InfiniBand
        id: detect-ib
        run: |
          if ls /dev/infiniband 2>/dev/null; then
            echo "ib_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No IB device found — InfiniBand tests will be skipped."
            echo "ib_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu124

      - name: Build Moodist
        run: pip install -e .

      - name: Run test suite
        run: |
          if [ "${{ steps.detect-ib.outputs.ib_available }}" = "true" ]; then
            torchrun --nproc-per-node=$(nvidia-smi --list-gpus | wc -l) tests/run.py
          else
            torchrun --nproc-per-node=$(nvidia-smi --list-gpus | wc -l) tests/run.py \
              test_allocator.py \
              test_compile_op.py \
              test_cuda_copy.py \
              test_device_mesh.py \
              test_model_transfer.py \
              test_nvlink_plan.py \
              test_queue.py \
              test_serialize.py \
              test_sharding.py \
              test_store.py \
              test_stress.py
          fi
